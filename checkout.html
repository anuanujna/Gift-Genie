<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | GiftGenie</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body><script src="layout.js"></script><main><section class="page-hero compact"><span class="script-label">A thoughtful finish</span><h1>Place Your Order</h1></section><form class="checkout-form" data-checkout-form><div><h2>Delivery details</h2><label>Full name<input name="name" required placeholder="Your name"></label><label>Mobile number<input name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number"></label><label>Address<textarea name="address" required placeholder="House, street, landmark"></textarea></label><div class="form-row"><label>City<input name="city" required></label><label>Pincode<input name="pincode" required pattern="[0-9]{6}"></label></div></div><div><h2>Payment method</h2><label class="payment-choice"><input type="radio" name="payment" value="Cash on Delivery" required> Cash on Delivery</label><label class="payment-choice"><input type="radio" name="payment" value="UPI (Demo)"> UPI (Demo)</label><button class="pink-button" type="submit">Place Order 🎉</button></div></form></main><div class="success-modal" data-success-modal role="dialog" aria-modal="true" aria-labelledby="success-title"><div class="success-modal-card"><div class="success-icon">✓</div><h2 id="success-title">Your order is placed successfully</h2><p data-success-message>Your order has been saved.</p><button class="pink-button" data-success-continue>View My Orders</button></div></div><div class="toast" data-toast></div><script src="app.js"></script></body></html>
