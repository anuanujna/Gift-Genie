<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse Gifts | GiftGenie</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body><script src="layout.js"></script><main><section class="page-hero"><span class="script-label">A little something for everyone</span><h1>Browse Gifts</h1><p>Explore thoughtful gifts by category, occasion, recipient, or budget.</p></section><section class="catalog-layout"><aside class="filter-panel"><h3>Filter gifts</h3><label>Category<select id="categoryFilter"><option value="">All categories</option><option>Friend</option><option>Family</option><option>Partner</option><option>Women</option><option>Men</option><option>General</option></select></label><label>Occasion<select id="occasionFilter"><option value="">All occasions</option><option>Birthday</option><option>Anniversary</option><option>Festival</option><option>Graduation</option><option>Just Because</option></select></label><label>Price<select id="priceFilter"><option value="">Any budget</option><option value="0-499">Under ₹500</option><option value="500-999">₹500–₹1000</option><option value="1000-1999">₹1000–₹2000</option><option value="2000-999999">₹2000+</option></select></label><button class="pink-button" id="applyFilters">Apply Filters →</button></aside><div class="catalog-results"><div class="section-title"><h2>All gifts</h2><span class="muted">Personalized ideas, ready to send</span></div><div class="product-grid" data-product-grid></div></div></section></main><div class="toast" data-toast></div><script src="app.js"></script><script>document.querySelector('#applyFilters').onclick=()=>{const c=document.querySelector('#categoryFilter').value,o=document.querySelector('#occasionFilter').value,p=document.querySelector('#priceFilter').value.split('-');const q=new URLSearchParams();if(c)q.set('category',c);if(o)q.set('occasion',o);if(p[0]){q.set('min',p[0]);q.set('max',p[1])}location.search=q}</script></body></html>
