<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Finder | GiftGenie</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body><script src="layout.js"></script><main><section class="page-hero finder-page-hero"><span class="script-label">A little magic goes a long way</span><h1>Let's Find the Perfect Gift!</h1><p>Answer a few simple questions and our Gift Genie will suggest thoughtful gifts.</p></section><form class="recommend-form" data-recommend-form><div class="quiz-step"><b>01</b><div><span class="script-label">First, tell us</span><h2>Who are you buying for?</h2><div class="option-grid"><label><input type="radio" name="recipient" value="Mother" required><span>👩<strong>Mother</strong></span></label><label><input type="radio" name="recipient" value="Father"><span>👨<strong>Father</strong></span></label><label><input type="radio" name="recipient" value="Friend"><span>👫<strong>Friend</strong></span></label><label><input type="radio" name="recipient" value="Partner"><span>💗<strong>Partner</strong></span></label><label><input type="radio" name="recipient" value="Family"><span>👨‍👩‍👧<strong>Brother/Sister</strong></span></label></div></div></div><div class="quiz-step"><b>02</b><div><span class="script-label">Set the scene</span><h2>What's the occasion?</h2><div class="select-row"><label><input type="radio" name="occasion" value="Birthday" required><span>🎂 Birthday</span></label><label><input type="radio" name="occasion" value="Anniversary"><span>💕 Anniversary</span></label><label><input type="radio" name="occasion" value="Festival"><span>✨ Festival</span></label><label><input type="radio" name="occasion" value="Graduation"><span>🎓 Graduation</span></label><label><input type="radio" name="occasion" value="Just Because"><span>💌 Just Because</span></label></div></div></div><div class="quiz-step"><b>03</b><div><span class="script-label">Keep it comfortable</span><h2>What's your budget?</h2><div class="select-row"><label><input type="radio" name="budget" value="under" required><span>Under ₹500</span></label><label><input type="radio" name="budget" value="500"><span>₹500–₹1000</span></label><label><input type="radio" name="budget" value="1000"><span>₹1000–₹2000</span></label><label><input type="radio" name="budget" value="2000"><span>₹2000+</span></label></div></div></div><button class="pink-button" type="submit">🎁 Recommend Gift <span>→</span></button></form></main><div class="toast" data-toast></div><script src="app.js"></script></body></html>
