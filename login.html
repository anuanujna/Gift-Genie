<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | GiftGenie</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body><script src="layout.js"></script><main class="auth-page"><section class="auth-visual"><span class="script-label">A little joy, waiting for you</span><h1>Welcome to your gifting space.</h1><p>Save your favorites, follow every delivery, and make thoughtful moments easier to plan.</p><img src="https://images.unsplash.com/photo-1512909006721-3d6018887383?auto=format&fit=crop&w=900&q=85" alt="Wrapped gifts ready to give"></section><form class="auth-card" onsubmit="event.preventDefault(); localStorage.setItem('giftgenie-auth','true'); location.href=new URLSearchParams(location.search).get('return') || 'index.html'"><span class="gift-icon">▥</span><span class="auth-kicker">GiftGenie account</span><h2>Welcome back</h2><p>Sign in to keep your gifting plans together.</p><label>Username or email<input name="username" type="text" required placeholder="Enter your username"></label><label>Password<div class="password-field"><input id="loginPassword" name="password" type="password" required placeholder="Enter your password"><button type="button" class="password-toggle" data-password-toggle aria-label="Show password">Show</button></div></label><div class="auth-links"><a href="register.html">Create an account</a><a href="register.html#change-password">Change password</a></div><button class="pink-button" type="submit">Login →</button><small>New to GiftGenie? <a href="register.html">Sign up here</a></small></form></main><script src="app.js"></script><script>document.querySelector('[data-password-toggle]').addEventListener('click',event=>{const input=document.querySelector('#loginPassword');const visible=input.type==='text';input.type=visible?'password':'text';event.currentTarget.textContent=visible?'Show':'Hide';event.currentTarget.setAttribute('aria-label',visible?'Show password':'Hide password');});</script></body></html>
